<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地域情報ポータル（練習用）</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>地域情報ポータルへようこそ</h1>
    <p>この見出しを課題で変更してみましょう（STEP 12）。</p>
  </header>
  <main>
    <section id="search">
      <h2>検索</h2>
      <!-- STEP 14でここにフォームを追加します -->
      <p>例: 祭り・公園・グルメで検索できるようにします。</p>
    </section>
    <section id="spots">
      <h2>おすすめスポット</h2>
      <ul id="spot-list">
        <li>中央公園 — 桜の名所</li>
        <li>夏祭り — 8月第1週末</li>
      </ul>
    </section>
    <section id="self-intro">
      <h2>自己紹介（SOLO-01用）</h2>
      <p>ここにあなたの自己紹介を1〜2行追加してください。</p>
    </section>
  </main>
  <footer>
    <p>GitHub実践教材サンプル</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
